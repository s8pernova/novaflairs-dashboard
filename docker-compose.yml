services:
  ui:
    container_name: novaflairs-ui
    build:
      context: .
      dockerfile: infra/Dockerfile.ui
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is required}
    image: novaflairs-dashboard-ui:${RELEASE_TAG:-local}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: ${TZ:-America/New_York}

  nodered:
    container_name: novaflairs-nodered
    build:
      context: .
      dockerfile: nodered/Dockerfile
    image: novaflairs-dashboard-nodered:${RELEASE_TAG:-local}
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-America/New_York}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:?NODE_RED_ADMIN_PASSWORD is required}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?NODE_RED_CREDENTIAL_SECRET is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      DB_CA_CERT: /certs/supabase-ca.pem
      NODE_EXTRA_CA_CERTS: /certs/supabase-ca.pem
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:1880/").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    volumes:
      - node_red_data:/data
      - ${NODE_RED_DB_CA_CERT_PATH:-/etc/novaflairs/supabase-ca.pem}:/certs/supabase-ca.pem:ro

  metabase:
    container_name: novaflairs-metabase
    image: metabase/metabase:v0.60.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_HOST: 0.0.0.0
      TZ: ${TZ:-America/New_York}
    volumes:
      - metabase_data:/metabase-data

volumes:
  node_red_data:
    name: novaflairs_nodered_data
  metabase_data:
    name: infra_metabase_data
