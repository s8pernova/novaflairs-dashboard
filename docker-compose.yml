services:
  ui:
    container_name: novaflairs-ui
    build:
      context: .
      dockerfile: infra/Dockerfile.ui
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: novaflairs-dashboard-ui:local
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TZ: ${TZ:-America/New_York}

  nodered:
    container_name: novaflairs-nodered
    build:
      context: .
      dockerfile: nodered/Dockerfile
    image: novaflairs-dashboard-nodered:local
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    env_file:
      - nodered/.env
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-America/New_York}
      DB_CA_CERT: /certs/supabase-ca.pem
      NODE_EXTRA_CA_CERTS: /certs/supabase-ca.pem
    volumes:
      - node_red_data:/data
      - ${NODE_RED_DB_CA_CERT_PATH:-/etc/novaflairs/supabase-ca.pem}:/certs/supabase-ca.pem:ro

  metabase:
    container_name: novaflairs-metabase
    image: metabase/metabase:v0.60.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_HOST: 0.0.0.0
      TZ: ${TZ:-America/New_York}
    volumes:
      - metabase_data:/metabase-data

volumes:
  node_red_data:
    name: novaflairs_node_red_data
  metabase_data:
