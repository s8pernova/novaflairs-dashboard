name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - "ui/**"
      - "nodered/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Connect to Tailscale
        # tailscale/github-action v4.1.3
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy
          ping: ${{ secrets.VM_HOST }}

      - name: Deploy to VM over SSH
        # appleboy/ssh-action v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VM_HOST }}
          username: kiddo
          key: ${{ secrets.VM_SSH_KEY }}
          timeout: 2m
          command_timeout: 45m
          script_stop: true
          script: |
            sudo -n -u deploy -- /usr/bin/bash \
              /srv/novaflairs-deploy/deploy.sh '${{ github.sha }}'
