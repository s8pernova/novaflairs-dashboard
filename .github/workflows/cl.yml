name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "ui/**"
      - "nodered/**"
      - "infra/**"
      - "supabase/**"
      - "scripts/check_supabase_layout.py"
      - "scripts/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/cl.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main", "dev"]
    paths:
      - "backend/**"
      - "ui/**"
      - "nodered/**"
      - "infra/**"
      - "supabase/**"
      - "scripts/check_supabase_layout.py"
      - "scripts/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/cl.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Supabase database infrastructure
  supabase-validate:
    name: Supabase · Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked repository tooling
        run: npm ci --ignore-scripts

      - name: Validate Supabase infrastructure
        run: |
          npx supabase --version
          python -m unittest discover -s scripts/tests
          npm run db:check-layout

  # UI 
  ui-lint:
    name: UI · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ui

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Node-RED 
  nodered-validate:
    name: Node-RED · Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node-RED userDir dependencies
        working-directory: nodered
        run: npm ci --omit=dev

      - name: Validate flows JSON
        run: |
          jq empty nodered/flows.json
          test ! -e nodered/flows_cred.json
          test ! -e nodered/.config.runtime.json
          test ! -e nodered/.config.users.json

      - name: Validate settings.js syntax
        run: node --check nodered/settings.js

      - name: Smoke boot Node-RED in safe mode
        run: |
          docker run -d \
            --name nodered-smoke \
            -p 1881:1880 \
            -e NODE_RED_ENABLE_SAFE_MODE=true \
            -e NODE_RED_CREDENTIAL_SECRET=ci-only-credential-secret \
            -e 'NODE_RED_ADMIN_PASSWORD=$2a$08$zZWtXTja0fB1pzD4sHCMyOCMYz2Z6dNbM6tl8sJogENOMcxWV9DN.' \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=postgres \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_SSL_REJECT_UNAUTHORIZED=false \
            -v "$GITHUB_WORKSPACE/nodered:/data" \
            nodered/node-red:latest

          sleep 15

          docker ps --filter name=nodered-smoke
          docker logs --tail=200 nodered-smoke

          docker rm -f nodered-smoke
